[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognisign"
version = "1.0.0"
description = "Turn hand gestures into speech and actions with any webcam. An open-source communication aid built on Google MediaPipe."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshan Randhawa", email = "joshanrandhawa5@hotmail.com" }]
requires-python = ">=3.10"
keywords = ["accessibility", "aac", "gesture-recognition", "mediapipe", "computer-vision", "assistive-technology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Adaptive Technologies",
]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyttsx3>=2.90",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cognisign = "cognisign.cli:main"

[project.urls]
Homepage = "https://github.com/z3zZ/CogniSign"
Portfolio = "https://joshan.dev"

[tool.setuptools]
packages = ["cognisign"]

[tool.setuptools.package-data]
cognisign = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
